name: Package App Files

on:
  push:
    branches: [ main, master ]

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make Archive Zip
      run: |
        zip -r mawaqit-tv-project.zip .

    - name: Upload Project Archive
      uses: actions/upload-artifact@v4
      with:
        name: Mawaqit-TV-Source-Files
        path: mawaqit-tv-project.zip
